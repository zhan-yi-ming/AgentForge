name: agentforge

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - agentforge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *bounded-logging
    networks: [app]

  core-api:
    build:
      context: ../services/core-api
    environment:
      AGENTFORGE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      AGENTFORGE_DB_USERNAME: ${POSTGRES_USER}
      AGENTFORGE_DB_PASSWORD: ${POSTGRES_PASSWORD}
      AGENTFORGE_SERVER_PORT: 8080
      AGENTFORGE_JWT_SECRET: ${AGENTFORGE_JWT_SECRET:?set AGENTFORGE_JWT_SECRET}
      AGENTFORGE_JWT_ISSUER: ${AGENTFORGE_JWT_ISSUER:?set AGENTFORGE_JWT_ISSUER}
      AGENTFORGE_JWT_TTL: ${AGENTFORGE_JWT_TTL:-PT30M}
      AGENTFORGE_AGENT_SERVICE_URL: http://agent-service:8000
      AGENTFORGE_AGENT_INTERNAL_TOKEN: ${AGENTFORGE_AGENT_INTERNAL_TOKEN:?set AGENTFORGE_AGENT_INTERNAL_TOKEN}
      AGENTFORGE_CORE_INTERNAL_TOKEN: ${AGENTFORGE_CORE_INTERNAL_TOKEN:?set AGENTFORGE_CORE_INTERNAL_TOKEN}
      AGENTFORGE_AGENT_CONNECT_TIMEOUT: PT2S
      AGENTFORGE_AGENT_READ_TIMEOUT: ${AGENTFORGE_AGENT_READ_TIMEOUT:-PT75S}
      AGENTFORGE_REGISTRATION_ENABLED: ${AGENTFORGE_REGISTRATION_ENABLED:-false}
      AGENTFORGE_AI_DAILY_LIMIT: ${AGENTFORGE_AI_DAILY_LIMIT:-30}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    logging: *bounded-logging
    networks: [app]

  agent-service:
    build:
      context: ../services/agent-service
    environment:
      AGENTFORGE_AGENT_INTERNAL_TOKEN: ${AGENTFORGE_AGENT_INTERNAL_TOKEN}
      AGENTFORGE_CORE_INTERNAL_TOKEN: ${AGENTFORGE_CORE_INTERNAL_TOKEN}
      AGENTFORGE_AGENT_CORE_API_URL: http://core-api:8080
      AGENTFORGE_AGENT_RAG_DB_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AGENTFORGE_AGENT_EMBEDDING_PROVIDER: hash
      AGENTFORGE_AGENT_EMBEDDING_DIMENSIONS: 384
      AGENTFORGE_AGENT_LLM_PROVIDER: ${AGENTFORGE_AGENT_LLM_PROVIDER:-disabled}
      AGENTFORGE_AGENT_LLM_API_KEY: ${AGENTFORGE_AGENT_LLM_API_KEY:-}
      AGENTFORGE_AGENT_LLM_BASE_URL: ${AGENTFORGE_AGENT_LLM_BASE_URL:-}
      AGENTFORGE_AGENT_LLM_MODEL: ${AGENTFORGE_AGENT_LLM_MODEL:-}
      AGENTFORGE_AGENT_LLM_MAX_TOKENS: ${AGENTFORGE_AGENT_LLM_MAX_TOKENS:-800}
      AGENTFORGE_AGENT_SYSTEM_PROMPT_SUFFIX: ${AGENTFORGE_AGENT_SYSTEM_PROMPT_SUFFIX:-}
      AGENTFORGE_AGENT_CONTEXT_TOKEN_BUDGET: ${AGENTFORGE_AGENT_CONTEXT_TOKEN_BUDGET:-8192}
      AGENTFORGE_AGENT_CONTEXT_RECENT_TURNS: ${AGENTFORGE_AGENT_CONTEXT_RECENT_TURNS:-4}
      AGENTFORGE_AGENT_CONTEXT_SUMMARY_TOKEN_BUDGET: ${AGENTFORGE_AGENT_CONTEXT_SUMMARY_TOKEN_BUDGET:-800}
      AGENTFORGE_AGENT_CONTEXT_MAX_SESSIONS: ${AGENTFORGE_AGENT_CONTEXT_MAX_SESSIONS:-1000}
      AGENTFORGE_AGENT_NAMESPACE_TENANT: ${AGENTFORGE_AGENT_NAMESPACE_TENANT:-agentforge}
      AGENTFORGE_AGENT_NAMESPACE_WORKSPACE: ${AGENTFORGE_AGENT_NAMESPACE_WORKSPACE:-default}
      AGENTFORGE_AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENTFORGE_AGENT_REQUEST_TIMEOUT_SECONDS:-60}
      AGENTFORGE_AGENT_LANGFUSE_ENABLED: ${AGENTFORGE_AGENT_LANGFUSE_ENABLED:-false}
      AGENTFORGE_AGENT_LANGFUSE_PUBLIC_KEY: ${AGENTFORGE_AGENT_LANGFUSE_PUBLIC_KEY:-}
      AGENTFORGE_AGENT_LANGFUSE_SECRET_KEY: ${AGENTFORGE_AGENT_LANGFUSE_SECRET_KEY:-}
      AGENTFORGE_AGENT_LANGFUSE_HOST: ${AGENTFORGE_AGENT_LANGFUSE_HOST:-https://cloud.langfuse.com}
      AGENTFORGE_AGENT_LANGFUSE_ENVIRONMENT: ${AGENTFORGE_AGENT_LANGFUSE_ENVIRONMENT:-production}
    depends_on:
      postgres:
        condition: service_healthy
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    logging: *bounded-logging
    networks: [app]

  web:
    build:
      context: ../apps/web
    depends_on:
      core-api:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *bounded-logging
    networks: [app]

  gateway:
    image: nginx:1.29-alpine
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
      PUBLIC_WWW_HOST: ${PUBLIC_WWW_HOST:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${AGENTFORGE_TLS_CURRENT_DIR:-/opt/agentforge/tls/current}:/etc/agentforge-tls:ro
      - ${AGENTFORGE_ACME_WEBROOT_DIR:-/opt/agentforge/tls/acme}:/var/www/certbot:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--spider", "https://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    logging: *bounded-logging
    networks: [app]

  loki:
    image: grafana/loki:3.7.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./observability/loki/config.yaml:/etc/loki/config.yaml:ro
      - agentforge-loki-data:/loki
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *bounded-logging
    networks: [app]

  alloy:
    image: grafana/alloy:v1.19.0
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agentforge-alloy-data:/var/lib/alloy/data
    depends_on:
      loki:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [DAC_OVERRIDE]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *bounded-logging
    networks: [app]

  grafana:
    image: grafana/grafana:12.3.11
    environment:
      GF_SERVER_ROOT_URL: https://${PUBLIC_URL_HOST:?set PUBLIC_URL_HOST}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agentforge-logs.json
    volumes:
      - agentforge-grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      loki:
        condition: service_started
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *bounded-logging
    networks: [app]

networks:
  app:
    driver: bridge

volumes:
  agentforge-postgres-data:
    name: ${AGENTFORGE_POSTGRES_VOLUME:-agentforge-postgres-data}
  agentforge-loki-data:
    name: ${AGENTFORGE_LOKI_VOLUME:-agentforge-loki-data}
  agentforge-alloy-data:
    name: ${AGENTFORGE_ALLOY_VOLUME:-agentforge-alloy-data}
  agentforge-grafana-data:
    name: ${AGENTFORGE_GRAFANA_VOLUME:-agentforge-grafana-data}
