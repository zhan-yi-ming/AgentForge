name: Core API CI

on:
  pull_request:
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api-ci.yml"
  push:
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Core API
        working-directory: services/core-api
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Assert PostgreSQL integration tests ran
        working-directory: services/core-api
        shell: python
        run: |
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("target/surefire-reports").glob("TEST-*.PersistenceIntegrationTest.xml"))
          assert len(reports) == 1, f"expected one PersistenceIntegrationTest report, found: {reports}"
          report = ET.parse(reports[0]).getroot()
          assert int(report.attrib["tests"]) >= 2, report.attrib
          assert int(report.attrib["skipped"]) == 0, report.attrib
          assert int(report.attrib["errors"]) == 0, report.attrib
          assert int(report.attrib["failures"]) == 0, report.attrib
          print("PersistenceIntegrationTest ran:", report.attrib)
