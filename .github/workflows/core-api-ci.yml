name: Core API CI

on:
  pull_request:
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api-ci.yml"
  push:
    paths:
      - "services/core-api/**"
      - ".github/workflows/core-api-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Core API
        working-directory: services/core-api
        run: mvn --batch-mode --no-transfer-progress verify
