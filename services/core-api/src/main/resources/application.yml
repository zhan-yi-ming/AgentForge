spring:
  application:
    name: agentforge-core-api
  datasource:
    url: ${AGENTFORGE_DB_URL:jdbc:postgresql://localhost:5432/agentforge}
    username: ${AGENTFORGE_DB_USERNAME:agentforge}
    password: ${AGENTFORGE_DB_PASSWORD:agentforge_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${AGENTFORGE_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
