spring:
  application:
    name: agentforge-core-api
  datasource:
    url: ${AGENTFORGE_DB_URL:jdbc:postgresql://localhost:5432/agentforge}
    username: ${AGENTFORGE_DB_USERNAME:agentforge}
    password: ${AGENTFORGE_DB_PASSWORD:agentforge_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

agentforge:
  security:
    registration-enabled: ${AGENTFORGE_REGISTRATION_ENABLED:true}
    jwt:
      secret: ${AGENTFORGE_JWT_SECRET}
      issuer: ${AGENTFORGE_JWT_ISSUER:https://agentforge.local/core-api}
      ttl: ${AGENTFORGE_JWT_TTL:PT30M}
  agent-service:
    base-url: ${AGENTFORGE_AGENT_SERVICE_URL:http://localhost:8000}
    internal-token: ${AGENTFORGE_AGENT_INTERNAL_TOKEN}
    connect-timeout: ${AGENTFORGE_AGENT_CONNECT_TIMEOUT:PT2S}
    read-timeout: ${AGENTFORGE_AGENT_READ_TIMEOUT:PT30S}
  core-internal:
    token: ${AGENTFORGE_CORE_INTERNAL_TOKEN}
  ai:
    daily-limit: ${AGENTFORGE_AI_DAILY_LIMIT:0}

server:
  port: ${AGENTFORGE_SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
