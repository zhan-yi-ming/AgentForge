[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentforge-agent-service"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langfuse>=4.0,<5",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-env>=1.1,<2", "testcontainers[postgres]>=4.10,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentforge_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
env = [
  "AGENTFORGE_AGENT_INTERNAL_TOKEN=test-only-internal-token",
  "AGENTFORGE_CORE_INTERNAL_TOKEN=test-only-core-token",
  "AGENTFORGE_AGENT_RAG_DB_DSN=postgresql://agentforge:agentforge@localhost:5432/agentforge",
]
